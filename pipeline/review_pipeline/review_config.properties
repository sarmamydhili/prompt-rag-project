# Review Pipeline Configuration (localhost only — independent from task_config.properties)

[mongodb]
mongo_server=127.0.0.1
mongo_port=27017
mongo_db_name=adaptive_learning_docs
mongo_questions_collection=dryrun_questions

[review]
subject=AP Calculus AB
skill=
level_num_min=3
limit=10

[models]
providers=grok,anthropic

[llm]
temperature=0.0
openai_llm_model=gpt-4o
anthropic_llm_model=claude-3-5-sonnet-latest
gemini_llm_model=gemini-1.5-flash
deepseek_llm_model=deepseek-reasoner
grok_llm_model=grok-3-latest

[output]
report_dir=pipeline/review_reports
